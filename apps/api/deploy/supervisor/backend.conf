; supervisor 进程配置（部署前请按实际环境修改 directory / user / 路径）
[program:backend]
directory=/home/appuser/xblog/apps/api
command=/home/appuser/.local/bin/uv run --no-sync uvicorn app.main:app --host 127.0.0.1 --port 10242 --workers 4
user=appuser
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/home/appuser/xblog/apps/api/logs/uvicorn.log
environment=APP_ENV="production"
