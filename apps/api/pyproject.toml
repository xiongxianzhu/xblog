[project]
name = "xblog-api"
version = "0.1.0"
description = "FastAPI 项目（由 create-fastapi 生成）。"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "sqlmodel==0.0.48",
    "sqlalchemy==2.1.6",
    "greenlet==3.5.6",
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "python-dotenv==1.2.4",
    "Jinja2==3.1.6",
    "pyjwt==2.15.1",
    "bcrypt==5.0.0",
    "markdown==3.11.2",
    "pygments==2.21.0",
    "python-multipart==0.0.33",
    "httpx==0.28.1",
    "tzdata==2026.6",
    "cryptography==50.0.2",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "ruff==0.17.3",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "aiosqlite==0.22.1",
]

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["app", "alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
index-url = "https://mirrors.tencent.com/pypi/simple/"

[tool.fastapi]
entrypoint = "app.main:app"
