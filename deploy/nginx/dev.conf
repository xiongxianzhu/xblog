# 完整的本地开发网关配置，独立于生产 nginx。
# nginx -c /absolute/path/to/xblog/deploy/nginx/dev.conf
worker_processes 1;
pid /tmp/xblog-dev-nginx.pid;
error_log stderr;
events { worker_connections 256; }
http {
    map $http_upgrade $xblog_connection_upgrade { default upgrade; '' close; }
    server {
        listen 127.0.0.1:10240;
        server_name localhost;
        client_max_body_size 32m;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $xblog_connection_upgrade;
        location = /admin { return 308 /admin/$is_args$args; }
        location ~ ^/(zh-CN|zh-TW|en)(/admin(?:/.*)?)$ { return 308 $2$is_args$args; }
        location /admin/ { proxy_pass http://127.0.0.1:10243; }
        location /api/v1/ {
            proxy_pass http://127.0.0.1:10242;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
        location / { proxy_pass http://127.0.0.1:10241; }
    }
}
