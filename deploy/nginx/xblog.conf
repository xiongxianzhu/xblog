# xblog 生产环境 — 同域 HTTPS 入口
#
# 路由约定（与 PRD / systemd 一致）：
#   /admin/  → apps/admin/dist（静态 SPA）
#   /        → Next.js  (127.0.0.1:10241)
#   /api/    → FastAPI  (127.0.0.1:10242)，含 /api/v1/uploads 静态文件
#
# 使用前准备证书，替换域名、证书路径和管理端 dist 路径。
# API 与公开站分别由 systemd 运行；管理端不需要 Node 常驻进程。

upstream xblog_web {
    server 127.0.0.1:10241;
    keepalive 32;
}

upstream xblog_api {
    server 127.0.0.1:10242;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name blog.example.com;
    return 301 https://blog.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name blog.example.com;

    ssl_certificate /etc/letsencrypt/live/blog.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 头像、Skill 包等上传；按需调大
    client_max_body_size 32m;

    access_log /var/log/nginx/xblog.access.log;
    error_log /var/log/nginx/xblog.error.log;

    # 素材库大文件上传（应用仍按图片/音频/视频分别校验大小）。
    location = /api/v1/admin/media {
        client_max_body_size 512m;
        client_body_timeout 300s;
        proxy_pass http://xblog_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # FastAPI API（含 SSE 流式 AI、/api/v1/uploads）
    location /api/ {
        proxy_pass http://xblog_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # AI SSE / 长连接：避免缓冲导致流式卡顿
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Ant Design 管理端为独立静态应用；保留深链接，缺失资源返回 404。
    location = /admin {
        return 308 /admin/$is_args$args;
    }
    location ~ ^/(zh-CN|zh-TW|en)(/admin(?:/.*)?)$ {
        return 308 $2$is_args$args;
    }
    location = /admin/index.html {
        alias /home/appuser/xblog/apps/admin/dist/index.html;
        add_header Cache-Control "no-cache";
    }
    location ^~ /admin/assets/ {
        alias /home/appuser/xblog/apps/admin/dist/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ ^/admin/(.+\.[^/]+)$ {
        alias /home/appuser/xblog/apps/admin/dist/$1;
    }
    location /admin/ {
        alias /home/appuser/xblog/apps/admin/dist/;
        try_files $uri $uri/ /admin/index.html;
    }

    # Next.js 公开站
    location / {
        proxy_pass http://xblog_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
